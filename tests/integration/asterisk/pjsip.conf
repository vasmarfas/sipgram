[global]
type=global
user_agent=AsteriskTest

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[491]
type=endpoint
context=from-internal
disallow=all
allow=opus,alaw,ulaw,slin16
auth=491
aors=491
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
timers=yes
callerid="Test PBX" <491>

[491]
type=auth
auth_type=userpass
username=491
password=test491

[491]
type=aor
max_contacts=2
qualify_frequency=15
remove_existing=yes

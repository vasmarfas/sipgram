[general]
static=yes
writeprotect=no

[from-internal]
; echo test
exten => 600,1,Answer()
 same => n,Echo()
; 1004 Hz test tone
exten => 601,1,Answer()
 same => n,Milliwatt()
; PBX sends DTMF to us, then hangs up
exten => 602,1,Answer()
 same => n,Wait(1)
 same => n,SendDTMF(123#,100)
 same => n,Wait(1)
 same => n,Hangup()
; rings 3s (180 Ringing) then echo
exten => 603,1,Ringing()
 same => n,Wait(3)
 same => n,Answer()
 same => n,Echo()
; busy
exten => 604,1,Busy(3)
; early media (183 + ringback tone) then hangup
exten => 605,1,Progress()
 same => n,Playtones(ring)
 same => n,Wait(3)
 same => n,StopPlayTones()
 same => n,Hangup()
; expects DTMF 123 from us; echo when correct, hangup otherwise
exten => 606,1,Answer()
 same => n,Read(D,,3,,,8)
 same => n,GotoIf($["${D}" = "123"]?ok)
 same => n,Hangup()
 same => n(ok),Echo()
; call the registered extension (used by originate)
exten => 491,1,Dial(PJSIP/491,25)
 same => n,Hangup()
; hangup from PBX side after N seconds
exten => 607,1,Answer()
 same => n,Wait(2)
 same => n,Hangup()

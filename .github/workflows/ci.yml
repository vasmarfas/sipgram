name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format github

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install libopus
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus0

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests --ignore=tests/integration -q

  asterisk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: End-to-end tests against Asterisk
        working-directory: tests/integration
        run: docker compose up --build --abort-on-container-exit --exit-code-from tester

      - name: Asterisk log
        if: failure()
        working-directory: tests/integration
        run: docker compose logs asterisk

      - name: Tear down
        if: always()
        working-directory: tests/integration
        run: docker compose down -v

services:
  sipgram:
    build: .
    # or take the prebuilt image instead of building:
    # image: ghcr.io/vasmarfas/sipgram:latest
    image: sipgram:latest
    container_name: sipgram
    restart: unless-stopped
    # host networking keeps SIP/RTP addressing simple (no NAT between the gateway and the PBX)
    network_mode: host
    volumes:
      - ./config:/app/config
      - ./sessions:/app/sessions
    environment:
      # the schedule section works in local time; without this the container lives in UTC
      TZ: ${TZ:-Europe/Moscow}
      # sessions_dir in the config is relative to config.yaml, which lives in the other volume
      SIPGRAM_SESSIONS_DIR: /app/sessions
    env_file:
      - .env
    # first-time login: docker compose run --rm sipgram login
    stdin_open: true
    tty: true
